<!doctype html>
<html lang="fi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Super Buukkaaja · Avainpelaaja OS</title>
<style>
:root{--bg:#070b16;--panel:#0f172a;--panel2:#111c31;--line:#24314a;--text:#eef4ff;--muted:#93a4c2;--blue:#3b82f6;--green:#22c55e;--yellow:#eab308;--red:#ef4444}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 20% 0,#14264b 0,transparent 35%),var(--bg);color:var(--text);font:14px system-ui,-apple-system,Segoe UI,sans-serif}.wrap{max-width:1450px;margin:auto;padding:18px}.top{display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin-bottom:16px}.brand{font-size:24px;font-weight:800}.sub{color:var(--muted)}.btn,.input,select{border:1px solid var(--line);background:var(--panel);color:var(--text);border-radius:10px;padding:10px 12px}.btn{cursor:pointer}.primary{background:var(--blue);border-color:var(--blue);font-weight:700}.green{background:#14532d;border-color:#166534}.grid{display:grid;grid-template-columns:repeat(6,1fr);gap:10px}.kpi{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:15px}.kpi b{display:block;font-size:26px}.layout{display:grid;grid-template-columns:1.2fr .8fr;gap:14px;margin-top:14px}.card{background:rgba(15,23,42,.94);border:1px solid var(--line);border-radius:16px;padding:16px}.row{display:flex;gap:10px;align-items:center;justify-content:space-between}.list{display:grid;gap:8px}.item{padding:12px;border:1px solid var(--line);border-radius:12px;background:var(--panel2)}.muted{color:var(--muted)}.tag{display:inline-block;border-radius:999px;padding:4px 8px;font-size:12px;background:#172554}.free{color:#86efac}.busy{color:#facc15}.danger{color:#fca5a5}.calendar{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}.day{min-height:92px;padding:8px;border:1px solid var(--line);border-radius:9px;background:var(--panel2)}.day small{color:var(--muted)}.bk{margin-top:6px;padding:6px;border-radius:7px;background:#172554;font-size:11px}.plan{display:grid;gap:7px}.planrow{display:grid;grid-template-columns:100px 1fr 70px 90px;gap:8px;align-items:center;padding:9px;border-bottom:1px solid var(--line)}.score{font-weight:800}.actions{display:flex;gap:8px;flex-wrap:wrap}@media(max-width:1000px){.grid{grid-template-columns:repeat(3,1fr)}.layout{grid-template-columns:1fr}}@media(max-width:600px){.grid{grid-template-columns:repeat(2,1fr)}.planrow{grid-template-columns:1fr}.calendar{grid-template-columns:repeat(2,1fr)}}
</style></head><body><div class="wrap">
<div class="top"><div><div class="brand">⚡ Super Buukkaaja</div><div class="sub">AI + CRM + kalenteri + myyjät + kauppapaikat yhdessä työpöydässä</div></div><span style="flex:1"></span><a class="btn" href="/">← Avainpelaaja OS</a><button class="btn" id="refresh">↻ Päivitä</button></div>
<div class="grid" id="kpis"></div>
<div class="layout"><section class="card"><div class="row"><h2>🎯 Tämän päivän ohjaamo</h2><input id="date" class="input" type="date"></div><div id="today" class="list"></div></section>
<section class="card"><h2>📞 Buukkarin työjono</h2><div id="leads" class="list"></div></section></div>
<div class="layout"><section class="card"><div class="row"><h2>🤖 Kuukauden AI-suunnitelma</h2><div class="actions"><select id="seller"></select><input id="month" class="input" type="month"><button class="btn primary" id="plan">Suunnittele</button></div></div><div id="planOut" class="plan"></div></section>
<section class="card"><h2>📍 Kauppapaikkojen käyttö</h2><div id="places" class="list"></div></section></div>
<div class="card" style="margin-top:14px"><div class="row"><h2>🗓️ Kalenterin pikakatselu</h2><span class="muted">AI ehdottaa — buukkaaja hyväksyy</span></div><div id="calendar" class="calendar"></div></div>
</div>
<script>
const $=s=>document.querySelector(s),token=()=>localStorage.getItem('avainpelaaja_token')||localStorage.getItem('token')||'';
let state={dashboard:null,plan:null};
async function api(path,opt={}){const h=opt.headers||{};const t=token();if(t)h.Authorization='Bearer '+t;h['Content-Type']='application/json';const r=await fetch(path,{...opt,headers:h});const x=await r.json();if(!r.ok)throw Error(x.error?.message||x.message||'Pyyntö epäonnistui');return x}
function esc(x){return String(x??'').replace(/[&<>"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m]))}
function dateNow(){return new Date().toISOString().slice(0,10)}
function render(){const d=state.dashboard;if(!d)return;$('#kpis').innerHTML=Object.entries({Myyjät:d.kpi.sellers,'Työssä':d.kpi.working,'Vapaat':d.kpi.free,'Paikat':d.kpi.places,'CRM-jono':d.kpi.pendingLeads,'Varaukset':d.kpi.bookings}).map(([k,v])=>'<div class="kpi"><span class="muted">'+k+'</span><b>'+v+'</b></div>').join('');
$('#today').innerHTML=d.sellers.map(s=>'<div class="item"><div class="row"><b>'+esc(s.name)+'</b><span class="'+(s.status==='vapaa'?'free':'busy')+'">● '+s.status+'</span></div>'+(s.today.length?s.today.map(b=>'<div class="bk">'+esc(b.start)+'–'+esc(b.end)+' · '+esc(b.placeName)+' · '+esc(b.status)+'</div>').join(''):'<span class="muted">Ei varausta tänään</span>')+'</div>').join('')||'<div class="muted">Ei myyjiä.</div>';
$('#leads').innerHTML=d.leads.map(l=>'<div class="item"><div class="row"><b>'+esc(l.name)+'</b><span class="tag">'+esc(l.status)+'</span></div><div class="muted">'+esc(l.city)+' · '+esc(l.next||'—')+' · '+esc(l.nextDate||'—')+'</div></div>').join('')||'<div class="muted">CRM-jono on tyhjä.</div>';
$('#places').innerHTML=d.placeLoad.slice(0,15).map(p=>'<div class="item"><b>'+esc(p.name)+'</b><span class="muted"> · '+esc(p.city)+' · '+p.bookings+' varaus</span></div>').join('');
calendar(d.today);
}
function calendar(bs){const root=$('#calendar');root.innerHTML='';const dt=new Date($('#date').value+'T12:00:00');const y=dt.getFullYear(),m=dt.getMonth();const first=new Date(y,m,1),days=new Date(y,m+1,0).getDate();for(let i=0;i<first.getDay();i++)root.insertAdjacentHTML('beforeend','<div></div>');for(let n=1;n<=days;n++){const ds=y+'-'+String(m+1).padStart(2,'0')+'-'+String(n).padStart(2,'0');const items=bs.filter(b=>b.date===ds);root.insertAdjacentHTML('beforeend','<div class="day"><small>'+n+'.</small>'+items.map(b=>'<div class="bk">'+esc(b.start)+' '+esc(b.sellerName)+'<br>'+esc(b.placeName)+'</div>').join('')+'</div>')}}
function fillSellers(){const arr=state.dashboard?.sellers||[];$('#seller').innerHTML=arr.map(s=>'<option value="'+esc(s.id)+'">'+esc(s.name)+'</option>').join('')}
async function refresh(){try{const d=$('#date').value||dateNow();state.dashboard=await api('/api/super-booker/dashboard?date='+encodeURIComponent(d));fillSellers();render()}catch(e){alert(e.message)}}
async function makePlan(){const seller=$('#seller').value,month=$('#month').value;if(!seller||!month)return alert('Valitse myyjä ja kuukausi.');try{state.plan=await api('/api/super-booker/plan',{method:'POST',body:JSON.stringify({sellerId:seller,month,radiusKm:100,minBlockDays:1,maxBlockDays:2,avoidWeekends:true})});$('#planOut').innerHTML='<div class="actions"><span class="tag">'+state.plan.candidates.length+' ehdokasta</span><span class="tag">'+state.plan.summary.items+' suunniteltua päivää</span><button class="btn green" id="approve">✓ Hyväksy suunnitelma</button></div>'+state.plan.plan.map((p,i)=>'<div class="planrow"><b>'+p.date+'</b><span>'+esc(p.placeName)+'</span><span class="score">'+(p.score??'—')+'</span><span class="muted">'+esc(p.reason)+'</span></div>').join('');$('#approve').onclick=approve}catch(e){alert(e.message)}}
async function approve(){if(!state.plan?.plan?.length)return;const x=await api('/api/super-booker/approve',{method:'POST',body:JSON.stringify({items:state.plan.plan})});alert('Luotu '+x.createdCount+' varausta. Ristiriitoja: '+x.conflictCount);await refresh()}
$('#date').value=dateNow();const n=new Date();$('#month').value=n.getFullYear()+'-'+String(n.getMonth()+1).padStart(2,'0');$('#refresh').onclick=refresh;$('#plan').onclick=makePlan;$('#date').onchange=refresh;refresh();
</script></body></html>

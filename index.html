<!DOCTYPE html>
<html lang="fi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#070b16">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<title>Avainpelaaja OS</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%232563eb'/%3E%3Ctext x='32' y='43' font-size='30' font-weight='800' text-anchor='middle' fill='white' font-family='sans-serif'%3EAP%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Manrope:wght@500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#070b16;--bg2:#0b1224;--panel:#0f1830;--panel2:#141f3c;--line:#1e2c4d;--line2:#2c3f69;
  --text:#e9effd;--muted:#8fa0c2;--dim:#5f7096;
  --blue:#3b82f6;--blue2:#2563eb;--green:#22c55e;--yellow:#eab308;--orange:#f97316;--red:#ef4444;--gray:#64748b;--purple:#a78bfa;
  --r:16px;--rs:10px;
  --head:'Bricolage Grotesque','Manrope',system-ui,sans-serif;
  --body:'Manrope',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{background:var(--bg)}
body{margin:0;background:radial-gradient(1200px 500px at 80% -10%,#101d40 0%,transparent 60%),var(--bg);color:var(--text);font-family:var(--body);font-size:15px;line-height:1.45;min-height:100vh}
button,input,select,textarea{font:inherit;color:inherit}
h1,h2,h3,h4{font-family:var(--head);margin:0;font-weight:700;letter-spacing:-.01em}
a{color:#8db4ff}
.app{max-width:1360px;margin:0 auto;padding-bottom:70px}
.muted{color:var(--muted)}.dim{color:var(--dim)}.small{font-size:12.5px}.right{text-align:right}.nowrap{white-space:nowrap}
.hide{display:none!important}

/* Top bar */
.topbar{position:sticky;top:0;z-index:30;display:flex;align-items:center;gap:10px;padding:12px 14px;background:rgba(7,11,22,.92);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.logo{width:50px;height:46px;border-radius:12px;background:linear-gradient(145deg,#3b82f6,#1d4ed8);display:grid;place-items:center;font-family:var(--head);font-weight:800;font-size:22px;letter-spacing:.5px;cursor:pointer;box-shadow:0 6px 20px rgba(37,99,235,.35);flex:none}
.ai-btn{flex:1;min-width:0;height:46px;border-radius:12px;border:1.5px solid #5b3fb5;background:linear-gradient(180deg,#221650,#1a1140);color:#cdbfff;font-weight:700;font-size:15px;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:8px;white-space:nowrap;overflow:hidden}
.ai-btn:hover{border-color:var(--purple)}
.icon-btn{position:relative;width:46px;height:46px;border-radius:12px;border:1px solid var(--line2);background:var(--panel);cursor:pointer;font-size:19px;flex:none}
.badge{position:absolute;top:-6px;right:-6px;min-width:22px;height:22px;border-radius:11px;background:#ef4444;color:#fff;font:700 12px/22px var(--body);text-align:center;font-style:normal;padding:0 5px;border:2px solid var(--bg)}
.avatar{width:46px;height:46px;border-radius:50%;background:var(--blue2);border:none;font-weight:800;font-size:19px;cursor:pointer;flex:none;color:#fff}
.tabs{display:flex;gap:8px;overflow-x:auto;padding:12px 14px;scrollbar-width:none;border-bottom:1px solid var(--line);background:var(--bg2);position:sticky;top:70px;z-index:25}
.tabs::-webkit-scrollbar{display:none}
.tab{flex:none;border:none;background:var(--panel2);color:var(--muted);padding:11px 16px;border-radius:12px;font-weight:700;cursor:pointer;font-size:15px;display:flex;gap:7px;align-items:center}
.tab.active{background:var(--blue2);color:#fff;box-shadow:0 4px 16px rgba(37,99,235,.35)}
.view{padding:16px 14px}
.ro-note{position:fixed;left:50%;bottom:14px;transform:translateX(-50%);background:#3a2a05;border:1px solid var(--yellow);color:#fde68a;padding:8px 14px;border-radius:999px;font-size:13px;z-index:40}
.foot{padding:20px 16px;color:var(--dim);font-size:12px;text-align:center}

/* Layout helpers */
.grid{display:grid;gap:12px}
.g2{grid-template-columns:repeat(auto-fit,minmax(min(100%,340px),1fr))}
.g3{grid-template-columns:repeat(auto-fit,minmax(min(100%,290px),1fr))}
.g4{grid-template-columns:repeat(auto-fit,minmax(min(100%,220px),1fr))}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.between{justify-content:space-between}
.stack{display:flex;flex-direction:column;gap:10px}
.grow{flex:1}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:16px}
.card+.card,.grid+.card,.card+.grid,.grid+.grid{margin-top:12px}
.card h3{font-size:17px;margin-bottom:12px}
.card h3 small{font-family:var(--body);font-weight:600;color:var(--muted);font-size:13px;margin-left:6px}
.sec-title{font-size:20px;margin:0 0 12px}
.hr{height:1px;background:var(--line);margin:14px 0;border:0}

/* Chips */
.chip{display:inline-flex;align-items:center;gap:6px;padding:4px 11px;border-radius:999px;font-size:13px;font-weight:700;border:1px solid;white-space:nowrap}
.chip.sm{padding:2px 8px;font-size:12px}
.chip.green{color:#4ade80;background:rgba(34,197,94,.12);border-color:rgba(34,197,94,.45)}
.chip.blue{color:#7fb0ff;background:rgba(59,130,246,.14);border-color:rgba(59,130,246,.5)}
.chip.yellow{color:#facc15;background:rgba(234,179,8,.12);border-color:rgba(234,179,8,.45)}
.chip.orange{color:#fb923c;background:rgba(249,115,22,.13);border-color:rgba(249,115,22,.5)}
.chip.red{color:#f87171;background:rgba(239,68,68,.13);border-color:rgba(239,68,68,.5)}
.chip.gray{color:#94a3b8;background:rgba(100,116,139,.15);border-color:rgba(100,116,139,.4)}
.chip.purple{color:#c4b5fd;background:rgba(167,139,250,.14);border-color:rgba(167,139,250,.5)}

/* Buttons & forms */
.btn{min-height:42px;padding:9px 16px;border-radius:11px;border:1px solid var(--line2);background:var(--panel2);cursor:pointer;font-weight:700;display:inline-flex;align-items:center;justify-content:center;gap:7px;text-decoration:none;color:var(--text)}
.btn:hover{border-color:#4b6299}
.btn.primary{background:var(--blue2);border-color:var(--blue2);color:#fff}
.btn.green{background:#15803d;border-color:#16a34a;color:#fff}
.btn.danger{background:rgba(239,68,68,.12);border-color:rgba(239,68,68,.5);color:#f87171}
.btn.ghost{background:transparent}
.btn.sm{min-height:34px;padding:5px 11px;font-size:13.5px;border-radius:9px}
.btn.big{min-height:60px;font-size:18px;border-radius:14px;width:100%}
.btn[disabled]{opacity:.4;pointer-events:none}
.btn.on{background:var(--blue2);border-color:var(--blue2);color:#fff}
.seg{display:inline-flex;background:var(--bg2);border:1px solid var(--line);border-radius:12px;padding:3px;gap:2px;flex-wrap:wrap}
.seg button{border:none;background:transparent;color:var(--muted);padding:8px 13px;border-radius:9px;font-weight:700;cursor:pointer}
.seg button.on{background:var(--blue2);color:#fff}
input,select,textarea{width:100%;background:var(--bg2);border:1px solid var(--line2);border-radius:10px;padding:10px 12px;min-height:42px;outline:none}
input:focus,select:focus,textarea:focus{border-color:var(--blue);box-shadow:0 0 0 3px rgba(59,130,246,.2)}
input[type=checkbox]{width:20px;height:20px;min-height:0;accent-color:var(--blue)}
textarea{min-height:80px;resize:vertical}
select{appearance:auto}
.fld{display:flex;flex-direction:column;gap:5px;font-size:13px;color:var(--muted);font-weight:600}
.fgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
.filters{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px;align-items:center}
.filters select,.filters input{width:auto;min-width:130px;flex:1 1 130px}
.search-box{position:relative;flex:2 1 220px}
.search-box input{padding-left:38px}
.search-box:before{content:'🔍';position:absolute;left:11px;top:50%;transform:translateY(-50%);font-size:15px}

/* Dashboard */
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.tile{background:var(--bg2);border:1px solid var(--line);border-radius:14px;padding:14px;text-align:left;cursor:pointer;display:flex;flex-direction:column;gap:8px;align-items:flex-start;color:var(--text)}
.tile:hover{border-color:#41598f}
.tile b{font-family:var(--head);font-size:36px;line-height:1;font-weight:800}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px}
.kpi{background:var(--bg2);border:1px solid var(--line);border-radius:14px;padding:12px 14px}
.kpi span{color:var(--muted);font-size:13px;font-weight:600}
.kpi b{display:block;font-family:var(--head);font-size:28px;margin-top:2px}
.ring-wrap{display:flex;align-items:center;gap:16px;margin-top:14px}
.ring{width:96px;height:96px;flex:none}
.bar{height:10px;border-radius:6px;background:var(--bg2);overflow:hidden;border:1px solid var(--line)}
.bar>i{display:block;height:100%;border-radius:6px}
.attn{display:flex;flex-direction:column;gap:8px}
.attn button{display:flex;gap:12px;align-items:center;text-align:left;background:var(--bg2);border:1px solid var(--line);border-left:4px solid var(--gray);border-radius:12px;padding:12px 14px;cursor:pointer;color:var(--text);font-weight:600}
.attn button.red{border-left-color:var(--red)}.attn button.orange{border-left-color:var(--orange)}.attn button.yellow{border-left-color:var(--yellow)}.attn button.purple{border-left-color:var(--purple)}.attn button.green{border-left-color:var(--green)}
.attn small{display:block;color:var(--muted);font-weight:500;font-size:12.5px}
.chart{width:100%;height:170px}
.tbl{width:100%;border-collapse:collapse;font-size:14px}
.tbl th{text-align:left;color:var(--muted);font-weight:700;font-size:12.5px;padding:8px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
.tbl td{padding:10px;border-bottom:1px solid var(--line);vertical-align:middle}
.tbl tr:last-child td{border-bottom:none}
.tbl .num{text-align:right;font-variant-numeric:tabular-nums}
.tbl tr.click{cursor:pointer}.tbl tr.click:hover td{background:rgba(59,130,246,.06)}
.tscroll{overflow-x:auto}
.list{display:flex;flex-direction:column}
.li{display:flex;align-items:center;gap:12px;padding:11px 4px;border-bottom:1px solid var(--line);cursor:pointer}
.li:last-child{border-bottom:none}
.li:hover{background:rgba(59,130,246,.05)}
.av{width:38px;height:38px;border-radius:50%;background:#1d2d57;display:grid;place-items:center;font-weight:800;font-size:13px;flex:none;color:#b8c9f5}
.li .grow b{display:block}
.li .grow span{color:var(--muted);font-size:13px}
.post{background:var(--bg2);border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin-bottom:8px}
.post small{color:var(--dim)}

/* Calendar */
.cal-head{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-bottom:12px}
.cal-title{font-family:var(--head);font-size:20px;font-weight:700;flex:1 1 200px;text-align:center}
.wk{overflow:auto;border:1px solid var(--line);border-radius:14px;background:var(--panel);max-height:72vh}
table.cal{border-collapse:separate;border-spacing:0;min-width:900px;width:100%}
table.cal th,table.cal td{border-right:1px solid var(--line);border-bottom:1px solid var(--line);padding:6px;vertical-align:top;min-width:118px}
table.cal thead th{position:sticky;top:0;background:#0d1730;z-index:3;font-size:13px;text-align:center;padding:9px 6px}
table.cal th.sticky{position:sticky;left:0;z-index:4;background:#0d1730;min-width:130px;max-width:150px;text-align:left}
table.cal thead th.sticky{z-index:5}
table.cal th.sticky small{display:block;color:var(--muted);font-weight:500}
table.cal th.today{color:#93c5fd;background:#12224a}
table.cal td.today{background:rgba(59,130,246,.05)}
table.cal td.drop-over{background:rgba(59,130,246,.22);outline:2px dashed var(--blue);outline-offset:-3px}
.cell{display:flex;flex-direction:column;gap:4px;min-height:44px}
.bk{display:flex;align-items:center;gap:5px;flex-wrap:wrap;padding:5px 7px;border-radius:8px;font-size:12px;border:1px solid;cursor:pointer;line-height:1.25;user-select:none}
.bk b{font-weight:700}.bk em{font-style:normal;opacity:.85}.bk i{font-style:normal;opacity:.7;margin-left:auto;font-weight:700}
.bk.green{background:rgba(34,197,94,.1);border-color:rgba(34,197,94,.4);color:#86efac}
.bk.blue{background:rgba(59,130,246,.15);border-color:rgba(59,130,246,.55);color:#9cc2ff}
.bk.yellow{background:rgba(234,179,8,.12);border-color:rgba(234,179,8,.5);color:#fde047}
.bk.red{background:rgba(239,68,68,.16);border-color:rgba(239,68,68,.6);color:#fca5a5}
.bk.orange{background:rgba(249,115,22,.14);border-color:rgba(249,115,22,.5);color:#fdba74}
.bk.dragging{opacity:.4}
.addbk{align-self:flex-end;border:1px dashed var(--line2);background:transparent;color:var(--dim);border-radius:7px;width:28px;height:24px;cursor:pointer;font-size:14px;line-height:1}
.addbk:hover{color:var(--text);border-color:var(--blue)}
.legend{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.month{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.mh{text-align:center;color:var(--muted);font-weight:700;font-size:13px;padding:4px}
.md{background:var(--panel);border:1px solid var(--line);border-radius:12px;min-height:74px;padding:8px;cursor:pointer;display:flex;flex-direction:column;gap:4px;text-align:left;color:var(--text)}
.md.out{opacity:.4}.md.today{border-color:var(--blue);box-shadow:0 0 0 1px var(--blue) inset}
.md b{font-family:var(--head)}
.md .cnt{font-size:12px;color:var(--muted)}
.dayplace{border:1px solid var(--line);border-radius:12px;padding:12px;margin-bottom:10px;background:var(--bg2)}

/* Conflicts */
.conf{border-radius:11px;padding:10px 12px;font-size:13.5px;border:1px solid;margin-top:8px}
.conf.ok{color:#86efac;border-color:rgba(34,197,94,.4);background:rgba(34,197,94,.08)}
.conf.error{color:#fca5a5;border-color:rgba(239,68,68,.55);background:rgba(239,68,68,.1)}
.conf.warn{color:#fdba74;border-color:rgba(249,115,22,.5);background:rgba(249,115,22,.1)}

/* CRM */
.kanban{display:flex;gap:12px;overflow-x:auto;padding-bottom:12px;scroll-snap-type:x proximity}
.col{flex:0 0 min(84vw,290px);background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:10px;scroll-snap-align:start;min-height:200px}
.col.drop-over{outline:2px dashed var(--blue);outline-offset:-3px}
.col h4{display:flex;justify-content:space-between;align-items:center;padding:4px 4px 10px;font-size:15px}
.col h4 span{background:var(--bg2);border-radius:999px;padding:1px 9px;font-size:13px;color:var(--muted)}
.kcard{background:var(--bg2);border:1px solid var(--line);border-left:4px solid var(--gray);border-radius:12px;padding:11px 12px;margin-bottom:9px;cursor:pointer}
.kcard:hover{border-color:#41598f}
.kcard b{display:block}
.kcard .next{margin-top:7px;font-size:13px}
.kcard.late{border-left-color:var(--red)}.kcard.today{border-left-color:var(--yellow)}.kcard.ok{border-left-color:var(--green)}
.call{display:flex;align-items:center;gap:12px;padding:12px;border:1px solid var(--line);border-radius:12px;margin-bottom:8px;background:var(--bg2)}
.call .time{font-family:var(--head);font-weight:700;width:52px;flex:none;color:#93c5fd}
.timeline{border-left:2px solid var(--line2);margin-left:6px;padding-left:14px}
.timeline div{margin-bottom:10px;font-size:14px}.timeline small{color:var(--dim);display:block}

/* Mobile view */
.phone{max-width:440px;margin:0 auto}
.today-card{background:linear-gradient(160deg,#152552,#0f1830);border:1px solid #2b4488;border-radius:20px;padding:18px}
.today-card h2{font-size:26px;margin:4px 0}
.timer{font-family:var(--head);font-size:54px;font-weight:800;text-align:center;letter-spacing:1px;margin:10px 0 2px;font-variant-numeric:tabular-nums}
.big-num{font-family:var(--head);font-size:44px;font-weight:800}
.shift-btns{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}

/* Modal */
.overlay{position:fixed;inset:0;background:rgba(3,6,14,.72);z-index:100;display:flex;align-items:flex-end;justify-content:center;animation:fade .15s ease-out}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes rise{from{transform:translateY(24px);opacity:.6}to{transform:none;opacity:1}}
.sheet{background:var(--panel);border:1px solid var(--line2);border-radius:22px 22px 0 0;width:100%;max-width:720px;max-height:92vh;display:flex;flex-direction:column;animation:rise .18s ease-out}
.sheet.wide{max-width:980px}
.sheet header{display:flex;align-items:center;gap:10px;padding:16px 18px 10px}
.sheet header h3{flex:1;font-size:20px}
.sheet .x{border:none;background:var(--panel2);width:38px;height:38px;border-radius:50%;cursor:pointer;font-size:18px;color:var(--text)}
.sheet .body{padding:6px 18px 18px;overflow:auto}
.sheet footer{display:flex;gap:10px;padding:12px 18px 18px;border-top:1px solid var(--line);flex-wrap:wrap;justify-content:flex-end}
@media(min-width:760px){.overlay{align-items:center}.sheet{border-radius:22px}}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:#e9effd;color:#0b1224;padding:11px 18px;border-radius:12px;font-weight:700;z-index:200;box-shadow:0 10px 30px rgba(0,0,0,.4);max-width:92vw;animation:rise .18s ease-out}

/* Map */
.mapwrap{background:#08112a;border:1px solid var(--line);border-radius:16px;overflow:hidden;position:relative}
.mapwrap svg{display:block;width:100%;height:auto}
.mapwrap .land{fill:#132247;stroke:#3a5288;stroke-width:1}
.mk{cursor:pointer}
.mk .ring2{fill:none;stroke:#fff;stroke-width:1.5;opacity:0}
.mk.sel .ring2{opacity:1}
.mapcard{margin-top:12px}
.dot{display:inline-block;width:11px;height:11px;border-radius:50%;margin-right:5px;vertical-align:-1px}

/* Score */
.score{width:64px;height:64px;border-radius:50%;display:grid;place-items:center;font-family:var(--head);font-weight:800;font-size:22px;border:4px solid}
.kv{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;font-size:14px}
.kv dt{color:var(--muted)}.kv dd{margin:0}
.ai-msg{background:var(--bg2);border:1px solid var(--line);border-radius:14px;padding:12px 14px;margin:8px 0}
.ai-msg.me{background:#16244d;border-color:#2b4488;margin-left:36px}
.ai-basis{margin-top:8px;padding-top:8px;border-top:1px dashed var(--line2);color:var(--purple);font-size:12.5px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chips button{background:#1a1140;border:1px solid #5b3fb5;color:#cdbfff;border-radius:999px;padding:8px 13px;font-weight:600;cursor:pointer;font-size:13.5px}
.notif{padding:12px;border-radius:12px;border:1px solid var(--line);margin-bottom:8px;background:var(--bg2)}
.notif.unread{border-left:4px solid var(--blue)}
:focus-visible{outline:2px solid #93c5fd;outline-offset:2px}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
@media(min-width:900px){.view{padding:22px}.topbar{padding:12px 22px}.tabs{padding:12px 22px;top:70px}.ai-btn{flex:none;padding:0 22px}.topbar .sp{flex:1}}
@media print{
  body{background:#fff;color:#000}.topbar,.tabs,.no-print,.foot,.ro-note{display:none!important}
  .card{border:1px solid #bbb;background:#fff;color:#000}.tbl td,.tbl th{color:#000;border-color:#ccc}
}

/* Tila (DEMO / TYÖ) */
.modebar{display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding:10px 14px;background:var(--bg2);border-bottom:1px solid var(--line)}
.modeseg{display:inline-flex;background:var(--bg);border:1px solid var(--line2);border-radius:14px;padding:4px;gap:4px}
.modeseg button{border:none;background:transparent;color:var(--muted);padding:10px 20px;border-radius:10px;font-weight:800;font-size:15px;cursor:pointer;min-height:44px;letter-spacing:.3px}
.modeseg button.on.demo{background:#5b3fb5;color:#fff;box-shadow:0 4px 14px rgba(91,63,181,.45)}
.modeseg button.on.work{background:#15803d;color:#fff;box-shadow:0 4px 14px rgba(21,128,61,.45)}
.modeinfo{flex:1;min-width:180px;color:var(--muted)}

function downloadCSV(name,rows){
  const txt=csvText(rows);

    const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;document.body.appendChild(a);a.click();

/* Yksinkertainen CSV-jäsennin: tukee lainausmerkkejä, pilkkuja ja puolipisteitä erottimena */
function parseCSV(text){
  const rows=[];let row=[],cell='',q=false,i=0,sep=null;
  if(!sep){const head=text.split(/\r?\n/,1)[0]||'';sep=(head.split(';').length>head.split(',').length)?';':','}
  while(i<text.length){
    const c=text[i];
    if(q){
      if(c==='"'){if(text[i+1]==='"'){cell+='"';i+=2;continue}q=false;i++;continue}
      cell+=c;i++;continue;
    }
    if(c==='"'){q=true;i++;continue}
    if(c===sep){row.push(cell);cell='';i++;continue}
    if(c==='\n'||c==='\r'){
      if(c==='\r'&&text[i+1]==='\n')i++;
      row.push(cell);cell='';rows.push(row);row=[];i++;continue;
    }
    cell+=c;i++;
  }
  if(cell.length||row.length){row.push(cell);rows.push(row)}
  return rows.filter(r=>r.some(c=>c.trim()!==''));
}

/* vCard (.vcf) -jäsennin: poimii FN/N, TEL, EMAIL, ADR/kaupunki jokaisesta BEGIN:VCARD…END:VCARD-lohkosta */
function parseVCard(text){
  const cards=text.split(/BEGIN:VCARD/i).slice(1);
  return cards.map(block=>{
    const lines=block.split(/\r?\n/).map(l=>l.replace(/^\s+/,''));
    const get=key=>{const l=lines.find(x=>new RegExp('^'+key+'([;:]|$)','i').test(x));if(!l)return'';const v=l.split(':').slice(1).join(':');return v.trim()};
    let name=get('FN');
    if(!name){const n=get('N');if(n)name=n.split(';').filter(Boolean).reverse().join(' ')}
    const tel=lines.filter(l=>/^TEL/i.test(l)).map(l=>l.split(':').slice(1).join(':').trim())[0]||'';
    const email=lines.filter(l=>/^EMAIL/i.test(l)).map(l=>l.split(':').slice(1).join(':').trim())[0]||'';
    const adr=get('ADR');let city='';
    if(adr){const parts=adr.split(';');city=(parts[3]||'').trim()}
    return{name,phone:tel,email,city};
  }).filter(c=>c.name);
}

const STAND_CAP=4;
function standCap(p,standId){const s=p&&p.stands.find(x=>x.id===standId);const c=s?Math.round(Number(s.capacity)):NaN;return c>=1&&c<=4?c:STAND_CAP}
const capTotal=p=>p.stands.reduce((a,s)=>a+standCap(p,s.id),0);
/** Suurin samanaikainen määrä aikavälejä; peräkkäiset välit eivät ole päällekkäisiä. */
function peakLoad(list){
  const ev=[];list.forEach(x=>{ev.push([x[0],1]);ev.push([x[1],-1])});
  ev.sort((a,b)=>a[0]-b[0]||a[1]-b[1]);
  let cur=0,max=0;ev.forEach(e=>{cur+=e[1];if(cur>max)max=cur});return max;
}

/* Konfliktit */
function conflicts(nb,ignoreId){
  const out=[];const st=S.settings;
  const s=seller(nb.sellerId),p=place(nb.placeId);
  if(!s||!p||!nb.date){out.push({level:'error',msg:'Valitse myyjä, kauppapaikka ja päivä.'});return out}
  if(!nb.start||!nb.end||tmin(nb.end)<=tmin(nb.start)){out.push({level:'error',msg:'Loppuajan pitää olla alkuajan jälkeen.'});return out}
  S.bookings.forEach(b=>{
    if(b.date!==nb.date||b.id===ignoreId)return;
    const ov=tmin(nb.start)<tmin(b.end)&&tmin(b.start)<tmin(nb.end);
    if(b.sellerId===nb.sellerId){
      const bp=place(b.placeId);
      if(ov)out.push({level:'error',code:'seller',msg:`${s.name} on jo varattu ${tf(b.start)}–${tf(b.end)} (${bp.name}).`});
      else if(b.placeId!==nb.placeId){
        const km=haversine(bp,p),need=Math.round(km/st.travelKmh*60+15);
        const gap=tmin(nb.start)>=tmin(b.end)?tmin(nb.start)-tmin(b.end):tmin(b.start)-tmin(nb.end);
        if(gap<need)out.push({level:'warn',code:'travel',msg:`Tarkista siirtymäaika: ${bp.name} → ${p.name} on noin ${Math.round(km)} km (arvio ${need} min), väliä on ${gap} min.`});
      }
    }
  });
  const sameStand=S.bookings.filter(b=>b.date===nb.date&&b.id!==ignoreId&&b.placeId===nb.placeId&&b.stand===nb.stand&&tmin(nb.start)<tmin(b.end)&&tmin(b.start)<tmin(nb.end));
  if(sameStand.length){
    const cap=standCap(p,nb.stand);
    if(peakLoad([[tmin(nb.start),tmin(nb.end)]].concat(sameStand.map(b=>[tmin(b.start),tmin(b.end)])))>cap){
      out.push({level:'error',code:'stand',msg:`Ständipaikka ${p.name} / ${nb.stand} on täynnä: enintään ${cap} myyjää samaan aikaan (${sameStand.map(b=>seller(b.sellerId).name.split(' ')[0]).join(', ')}).`});
    }
  }
  const h=(tmin(nb.end)-tmin(nb.start))/60;
  if(h>st.maxShiftH)out.push({level:'warn',code:'long',msg:`Liian pitkä työvuoro: ${d1(h)} h (raja ${st.maxShiftH} h).`});
  if(nb.status==='tentative')out.push({level:'warn',code:'unconfirmed',msg:'Varaus on vahvistamatta.'});
  if(p.contract&&(nb.date<p.contract.start||nb.date>p.contract.end))out.push({level:'warn',code:'contract',msg:`Päivä on sopimuksen ulkopuolella (${fd(p.contract.start)}–${fd(p.contract.end)}).`});
  const ab=absenceOn(s,nb.date);
  if(ab)out.push({level:'warn',code:'absence',msg:`Myyjällä on merkitty poissaolo (${ab.type}) tälle päivälle.`});
  if(p.requiredSkill&&!(s.skills||[]).includes(p.requiredSkill))out.push({level:'warn',code:'skill',msg:`${s.name} ei ole merkitty osaavaksi: "${p.requiredSkill}". Tarkista sopiiko myyjä tälle ständille.`});
  return out;
}

function availabilityInfo(p,from,days){
  /* palauttaa {freeRatio, nextFree} */
  let free=0,total=0,next=null;
  for(let i=0;i<days;i++){
    const d=addISO(from,i);
    const used=S.bookings.filter(b=>b.date===d&&b.placeId===p.id).length;
    const f=capTotal(p)-used;
    total+=capTotal(p);free+=Math.max(0,f);
    if(!next&&f>0&&d>=p.contract.start&&d<=p.contract.end)next=d;
  }
  return{ratio:total?free/total:0,nextFree:next};
}

  if(p.neg)return'neg';

  const st=placeStats(p.id);

}

  if(tent.length)out.push({c:'red',ico:'🔴',text:`${tent.length} vahvistamatonta ständipaikkaa`,sub:`Seuraava: ${place(tent[0].placeId).name} ${fd(tent[0].date)}`,act:'goto-date',tab:'kalenteri',date:tent[0].date,basis:`Varaukset (${S.bookings.length} kpl), tila = vahvistamatta`});
  const nw=sellersWithoutNextWeek();
  if(nw.length)out.push({c:'orange',ico:'🟠',text:`${nw.length} myyjää ilman ensi viikon vuoroa`,sub:nw.slice(0,3).map(s=>s.name.split(' ')[0]).join(', ')+(nw.length>3?' …':''),act:'goto',tab:'myyjat',sfilter:'noshift',basis:`Myyjät (${S.sellers.length}) ja ensi viikon varaukset`});
  const cl=callList();
  if(cl.length)out.push({c:'yellow',ico:'🟡',text:`${cl.length} kauppapaikkaa odottaa yhteydenottoa`,sub:'Soittolista tälle päivälle',act:'goto',tab:'crm',crmview:'calls',basis:'CRM-kohteiden seuraava toimenpide ≤ tänään'});
  S.places.filter(p=>p.contract.end<=addISO(t,30)).sort((a,b)=>a.contract.end.localeCompare(b.contract.end)).forEach(p=>{
    const days=Math.round((parseISO(p.contract.end)-parseISO(t))/86400000);
    out.push({c:'yellow',ico:'🔔',text:`Sopimus päättymässä: ${p.name}`,sub:`${days} pv jäljellä (${fd(p.contract.end)})`,act:'place-open',id:p.id,basis:`Kauppapaikan ${p.name} sopimustiedot`});
  });
  const inc=S.incidents.filter(i=>i.status!=='ratkaistu');
  if(inc.length)out.push({c:'red',ico:'🚨',text:`${inc.length} avointa poikkeamaa`,sub:inc[0].title,act:'goto',tab:'lisaa',more:'poikkeamat',basis:'Poikkeamat, tila ≠ ratkaistu'});
  const sw=S.swaps.filter(w=>w.status!=='vahvistettu'&&w.status!=='hylatty');
  if(sw.length)out.push({c:'purple',ico:'★',text:`${sw.length} vuoronvaihtopyyntöä odottaa`,sub:'Hyväksy tai vahvista',act:'goto',tab:'lisaa',more:'vaihdot',basis:'Vuoronvaihtopyynnöt'});
  return out;
}

function ringSVG(pct,color){
  const r=40,c=2*Math.PI*r,p=Math.min(100,Math.max(0,pct));
  return `<svg class="ring" viewBox="0 0 100 100"><circle cx="50" cy="50" r="${r}" fill="none" stroke="#1e2c4d" stroke-width="10"/><circle cx="50" cy="50" r="${r}" fill="none" stroke="${color}" stroke-width="10" stroke-linecap="round" stroke-dasharray="${c*p/100} ${c}" transform="rotate(-90 50 50)"/><text x="50" y="57" text-anchor="middle" fill="#e9effd" font-family="Bricolage Grotesque,sans-serif" font-weight="800" font-size="22">${Math.round(pct)}%</text></svg>`;
}
function dealsChart(){
  const y=Y(),days=[];for(let i=13;i>=0;i--)days.push(addISO(y,-i));
  const data=days.map(d=>{const l=bookingsOn(d);return{d,v:l.reduce((a,b)=>a+(b.deals||0),0),t:l.length*S.settings.targetPerShift}});
  const max=Math.max(...data.map(x=>Math.max(x.v,x.t)),1);
  const W=700,H=170,bw=W/data.length;
  let s=`<svg class="chart" viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" role="img" aria-label="Kaupat päivittäin">`;
  data.forEach((x,i)=>{
    const h=(x.v/max)*(H-34),th=(x.t/max)*(H-34);
    const col=x.t&&x.v>=x.t?'#22c55e':x.t&&x.v>=x.t*.8?'#eab308':'#3b82f6';
    s+=`<rect x="${i*bw+6}" y="${H-24-h}" width="${bw-12}" height="${h}" rx="5" fill="${col}" opacity=".9"><title>${fd(x.d)}: ${x.v} kauppaa, tavoite ${x.t}</title></rect>`;
    s+=`<line x1="${i*bw+3}" x2="${(i+1)*bw-3}" y1="${H-24-th}" y2="${H-24-th}" stroke="#a78bfa" stroke-width="2" stroke-dasharray="4 3"/>`;
    s+=`<text x="${i*bw+bw/2}" y="${H-7}" text-anchor="middle" fill="#8fa0c2" font-size="12">${parseISO(x.d).getDate()}.</text>`;
  });
  return s+'</svg>';
}

    if(i>=35&&!cur)break;
    const l=bookingsOn(d).filter(b=>!UI.calRegion||place(b.placeId).region===UI.calRegion);
    const tent=l.filter(b=>b.status==='tentative').length;
    h+=`<button class="md ${cur?'':'out'} ${d===t?'today':''}" data-act="cal-day" data-date="${d}"><b>${parseISO(d).getDate()}</b><span class="cnt">${l.length?l.length+' vuoroa':'—'}</span>${tent?chipC('yellow','◐ '+tent,'sm'):''}</button>`;
  }
  return h+'</div>';
}

function tryMove(b,patch){
  if(!guard())return;
  const nb=Object.assign({},b,patch);
  const c=conflicts(nb,b.id).filter(x=>x.code!=='unconfirmed');
  const errs=c.filter(x=>x.level==='error');
  if(errs.length){openModal({title:'🔴 Siirtoa ei voi tehdä',body:confHTML(c),foot:'<button class="btn primary" data-act="close">Selvä</button>'});return}
  if(c.length){UI.pendingMove={id:b.id,patch};openModal({title:'🟠 Tarkista siirto',body:confHTML(c)+'<p class="muted">Haluatko siirtää varauksen silti?</p>',foot:'<button class="btn" data-act="close">Peruuta</button><button class="btn primary" data-act="confirm-move">Siirrä silti</button>'});return}
  applyMove(b.id,patch);
}
function applyMove(id,patch){
  const b=booking(id),before=Object.assign({},b),old=bsum(b);Object.assign(b,patch);
  if(patch.stand===undefined&&patch.placeId){const p=place(b.placeId);if(!p.stands.some(s=>s.id===b.stand)){b.stand=p.stands[0].id}}
  /* jos ständi on jo varattu, hae vapaa */
  const p=place(b.placeId);
  if(conflicts(b,b.id).some(x=>x.code==='stand')){const free=p.stands.find(s=>!conflicts(Object.assign({},b,{stand:s.id}),b.id).some(x=>x.code==='stand'));if(free)b.stand=free.id}
  audit('Varaus siirretty',old,bsum(b));notify('Varaus siirretty: '+bsum(b),'booking');save();render();
  actionToast('Varaus siirretty: '+bsum(b),'Kumoa',()=>{Object.assign(b,before);audit('Siirto kumottu',bsum(b),old);save();render()});
}
ACT['confirm-move']=()=>{const m=UI.pendingMove;if(m){applyMove(m.id,m.patch);UI.pendingMove=null}closeModal()};
function handleDrop(drag,d){
  if(drag.startsWith('b:')){
    const b=booking(drag.slice(2));if(!b)return;
    if(d.drop==='cell'){
      if(b.placeId===d.place&&b.date===d.date)return;
      const p=place(d.place);
      /* valitse vapaa ständi kohteesta */
      const stand=p.stands.map(s=>s.id).find(id=>!conflicts(Object.assign({},b,{placeId:d.place,date:d.date,stand:id}),b.id).some(x=>x.code==='stand'))||p.stands[0].id;
      tryMove(b,{placeId:d.place,date:d.date,stand});
    }else if(d.drop==='scell'){
      if(b.sellerId===d.seller&&b.date===d.date)return;
      tryMove(b,{sellerId:d.seller,date:d.date});
    }
  }else if(drag.startsWith('l:')&&d.drop==='col'){
    const l=lead(drag.slice(2));if(!l||l.status===d.status)return;
    if(!guard())return;
    const old=LEAD_ST[l.status].t;l.status=d.status;l.history.push({ts:Date.now(),text:'Tila muutettu: '+old+' → '+LEAD_ST[l.status].t});
    audit('CRM-tila muutettu',old,LEAD_ST[l.status].t+' ('+l.name+')');save();render();toast(l.name+' → '+LEAD_ST[l.status].t);
  }
}
